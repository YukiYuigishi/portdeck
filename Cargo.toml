[package]
name = "portdeck"
version = "0.1.0"
edition = "2024"

[dependencies]
glob = "0.3.4"
thiserror = "2.0.19"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
